# Coolify deployment (build pack "Docker Compose"): the API image plus its own Postgres.
# No host ports: Coolify's proxy routes the domain to api:3030 (domain set as https://<host>:3030 in Coolify),
# Postgres is only reachable on the internal network. All other variables come from Coolify (see docs/DEPLOYMENT.md).
# SERVICE_PASSWORD_POSTGRES is generated by Coolify.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://api_selfservice:${SERVICE_PASSWORD_POSTGRES}@apiselfservice-db:5432/api_selfservice
      PORT: "3030"
    depends_on:
      apiselfservice-db:
        condition: service_healthy

  # Unique service name: Coolify attaches services to a shared network where a plain `postgres` can resolve to another app's database.
  apiselfservice-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: api_selfservice
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: api_selfservice
    volumes:
      - pgdata-coolify:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_selfservice -d api_selfservice"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata-coolify:
