# Local LiteLLM for development and the live E2E suite (docker compose --profile litellm up -d).
# No provider keys needed: every model answers with mock_response, but LiteLLM still counts
# tokens, prices them and writes spend logs, so budgets and spend ingestion behave like production.
model_list:
  # priced chat model; the live suite picks the cheapest priced one (or set E2E_LIVE_MODEL)
  - model_name: local-gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: sk-not-used
      mock_response: OK
    model_info:
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006
  - model_name: local-gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: sk-not-used
      mock_response: OK
    model_info:
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
  - model_name: local-claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: sk-not-used
      mock_response: OK
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
  # free model (no cost)
  - model_name: local-free
    litellm_params:
      model: openai/local-free
      api_key: sk-not-used
      mock_response: OK
    model_info:
      mode: chat
      input_cost_per_token: 0
      output_cost_per_token: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # write spend to the database quickly so budget checks and /spend/logs follow within seconds
  proxy_batch_write_at: 5
